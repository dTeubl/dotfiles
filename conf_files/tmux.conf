set-option -g status-position top
set-option -g mouse on
set-option -sg escape-time 10
set-option -g focus-events on

# More reachable command key prefix
set-option -g prefix C-a
bind-key c-a send-prefix

# Splitting panes logically
bind | split-window -h
bind - split-window -v

# Proper movement between panes witouth C-a
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resizeing pane with proper keys
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Selecting different window without command key
bind -n M-0 select-window -t:=0
bind -n M-1 select-window -t:=1
bind -n M-2 select-window -t:=2
bind -n M-3 select-window -t:=3
bind -n M-4 select-window -t:=4
bind -n M-5 select-window -t:=5
bind -n M-6 select-window -t:=6
bind -n M-7 select-window -t:=7
bind -n M-8 select-window -t:=8
bind -n M-9 select-window -t:=9


# window color setting:
set -g window-style 'bg=colour236'
set -g window-active-style 'fg=colour255,bg=colour0'


# Status bar setup
set -g status-style "fg=colour255"
set -g status-style "bg=colour0"

#set -g status-right " #( upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep -E \"time\ to\ \" | awk \' {print $4 \" h\"}  \' ) #[fg=green] |#[fg=white] #( sensors | awk \' /CPU/ {print $2} \' ) #[fg=green][#[fg=white] %H:%M %p#[fg=green]]"

set -g status-right " #(cat /sys/class/power_supply/BAT1/capacity)% | %H:%M "
